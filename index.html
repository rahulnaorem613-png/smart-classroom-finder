<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Classroom Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  margin:0;
  padding:20px;
  color:#111;
}
.container{
  max-width:900px;
  margin:auto;
}
h1{
  text-align:center;
  color:#fff;
  margin-bottom:20px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 15px 30px rgba(0,0,0,0.2);
  margin-bottom:20px;
}
label{
  font-weight:bold;
  display:block;
  margin-top:10px;
}
select,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#4f46e5;
  color:white;
  border:none;
  cursor:pointer;
  margin-top:15px;
}
button:hover{
  background:#4338ca;
}
.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
.room{
  border-radius:12px;
  padding:15px;
  border:1px solid #e5e7eb;
}
.free{
  background:#ecfdf5;
}
.occupied{
  background:#fee2e2;
}
.status{
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}
input,
textarea,
select {
  color: #0f172a;   /* FORCE visible text */
  background: #fff;
}
.bot-message .bubble {
  color: #0f172a !important;
  font-size: 0.95rem;
  line-height: 1.4;
}
/* 🔥 FIX CHAT INPUT BAR ISSUE */
#chatPopup button {
  width: auto !important;
  margin-top: 0 !important;
  padding: 10px 18px;
  flex-shrink: 0;
}

#chatPopup input {
  margin-top: 0 !important;
}

input,
textarea,
select {
  color: #0f172a;   /* FORCE visible text */
  background: #fff;
}
.bot-message .bubble {
  color: #0f172a !important;
  font-size: 0.95rem;
  line-height: 1.4;
}
/* 🔥 FIX CHAT INPUT BAR ISSUE */
#chatPopup button {
  width: auto !important;
  margin-top: 0 !important;
  padding: 10px 18px;
  flex-shrink: 0;
}

#chatPopup input {
  margin-top: 0 !important;
}
</style>
</head>

<body>
<div class="container">
<h1>🏫 Smart Classroom Finder</h1>

<div class="card">
  <label>Select Building</label>
  <select id="building">
    <option value="A Block">A Block</option>
    <option value="B Block">B Block</option>
    <option value="C Block">C Block</option>
  </select>

  <label>Select Time Slot</label>
  <select id="time">
    <option>10:00 - 11:00</option>
    <option>11:00 - 12:00</option>
    <option>2:00 - 3:00</option>
  </select>

  <button onclick="showRooms()">Check Availability</button>
</div>

<div class="card">
  <h2>Available Rooms</h2>
  <div id="rooms" class="rooms"></div>
</div>
</div>

 <!-- FLOATING CHAT BOT ICON -->
<button id="chatToggle" style="
position:fixed;
bottom:20px;
right:20px;
z-index:999;
width:60px;
height:60px;
border-radius:50%;
border:none;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
font-size:26px;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
"> 💬 </button>

<!-- CHAT BOT POPUP -->
<div id="chatPopup" style="
display:none;
position:fixed;
bottom:90px;
right:20px;
z-index:999;
width:560px;
height:630px;
background:#fff;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.3);
overflow:hidden;
display:flex;
flex-direction:column;
">



  <div style="
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:14px;
text-align:center;
font-weight:600;
"> ✨ Chat Assistant </div>

  <div id="messages" style="
flex:1;
overflow-y:auto;
padding:12px;
background:#f8f9fa;
"></div>

  <div style="
display:flex;
align-items:center;
padding:10px;
border-top:1px solid #351fa4;
gap:10px;
background:#fff;
">

   <input id="userInput" placeholder="Type or speak..." style="flex:1;padding:10px;border-radius:20px;border:1px solid #ccc;outline:none;" onkeypress="handleKeyPress(event)">

<button id="sendBtn" onclick="sendMessage()" style="padding:10px 16px;border:none;border-radius:20px;background:#667eea;color:white;"> Send </button>


  </div>

</div>

<script>
const defaultRooms = [
  "Room 101","Room 102","Room 103","Physics Lab","Computer Lab"
];

let data = JSON.parse(localStorage.getItem("rooms")) || {};

function showRooms(){
  const b = building.value;
  const t = time.value;
  const key = b + "_" + t;

  if(!data[key]){
    data[key] = defaultRooms.map(r=>({name:r,free:true}));
  }

  render(key);
}

function render(key){
  const box = document.getElementById("rooms");
  box.innerHTML="";

  data[key].forEach((r,i)=>{
    const div=document.createElement("div");
    div.className="room "+(r.free?"free":"occupied");
    div.innerHTML=`
      <div class="status">${r.free?"✅ FREE":"❌ OCCUPIED"}</div>
      <h3>${r.name}</h3>
      <button onclick="toggle('${key}',${i})">
        Mark ${r.free?"Occupied":"Free"}
      </button>
    `;
    box.appendChild(div);
  });
}

function toggle(key,i){
  data[key][i].free=!data[key][i].free;
  localStorage.setItem("rooms",JSON.stringify(data));
  render(key);
}

 const API_KEY = "AIzaSyCfVsdGnux5bp4pkry6sdZpSHEksxWDeYY";     //ENTER YOUR API KEY

const chatToggle = document.getElementById("chatToggle");
const chatPopup  = document.getElementById("chatPopup");
const messages   = document.getElementById("messages");

chatToggle.onclick = () => {
  chatPopup.style.display =
    chatPopup.style.display === "none" ? "flex" : "none";
};

function handleKeyPress(e){
  if(e.key==="Enter") sendMessage();
}

async function sendMessage(){
  const input=document.getElementById("userInput");
  const btn=document.getElementById("sendBtn");
  if(!input.value.trim()) return;

  addMsg(input.value,"user");
  const text=input.value;
  input.value = "";
input.focus();
btn.disabled = true;


  const typing=document.createElement("div");
  typing.className="bot-message";
  typing.innerHTML=`<div class="bubble typing">
    <span></span><span></span><span></span>
  </div>`;
  messages.appendChild(typing);
  messages.scrollTop=messages.scrollHeight;

  try{
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          contents:[{ parts:[{ text:text }] }]
        })
      }
    );
    const data=await res.json();
    typing.remove();
    addMsg(data.candidates[0].content.parts[0].text,"bot");
  }catch{
    typing.remove();
    addMsg("Network error ❌","bot");
  }finally{
    btn.disabled=false;
  }
}

function addMsg(text,type){
  const div=document.createElement("div");
  div.className=`message ${type}-message`;
  div.innerHTML=`<div class="bubble">${escapeHtml(text)}</div>`;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function escapeHtml(t){
  const d=document.createElement("div");
  d.textContent=t;
  return d.innerHTML;
}

const userInput = document.getElementById("userInput");
const sendBtn   = document.getElementById("sendBtn");

/* ENTER KEY FIX */
userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* BUTTON CLICK */
sendBtn.addEventListener("click", sendMessage);


</script>
</body>
</html>
